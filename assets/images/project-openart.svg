<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312E81" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="800" height="500" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Accent -->
  <circle cx="400" cy="250" r="180" fill="url(#accentGrad)" opacity="0.15" filter="blur(40px)"/>

  <!-- Figma UI Frame Representation -->
  <rect x="70" y="50" width="660" height="400" rx="12" fill="#18181B" stroke="#3F3F46" stroke-width="2"/>
  
  <!-- Top bar -->
  <rect x="70" y="50" width="660" height="36" rx="12" fill="#27272A"/>
  <circle cx="95" cy="68" r="5" fill="#EF4444"/>
  <circle cx="112" cy="68" r="5" fill="#F59E0B"/>
  <circle cx="129" cy="68" r="5" fill="#10B981"/>
  <text x="400" y="73" fill="#A1A1AA" font-family="'Outfit', sans-serif" font-size="12" text-anchor="middle" font-weight="500">OpenArt — Design Platform (Figma)</text>

  <!-- Left Sidebar / Navigation -->
  <rect x="85" y="100" width="130" height="330" rx="8" fill="#27272A" opacity="0.6"/>
  <rect x="100" y="120" width="80" height="12" rx="4" fill="#6366F1"/>
  <rect x="100" y="150" width="100" height="8" rx="3" fill="#52525B"/>
  <rect x="100" y="170" width="75" height="8" rx="3" fill="#52525B"/>
  <rect x="100" y="190" width="90" height="8" rx="3" fill="#52525B"/>
  
  <!-- Main Content Showcase / Gallery Grid -->
  <!-- Featured Hero Banner inside UI -->
  <rect x="230" y="100" width="480" height="140" rx="10" fill="url(#cardGrad)"/>
  <text x="255" y="145" fill="#FFFFFF" font-family="'Outfit', sans-serif" font-size="20" font-weight="700">OpenArt Community</text>
  <text x="255" y="170" fill="#E0E7FF" font-family="'Inter', sans-serif" font-size="12">Creative UI &amp; Component System Exploration</text>
  <rect x="255" y="190" width="100" height="28" rx="14" fill="#FFFFFF"/>
  <text x="305" y="208" fill="#4338CA" font-family="'Outfit', sans-serif" font-size="11" font-weight="700" text-anchor="middle">Explorar</text>

  <!-- Gallery Cards below -->
  <rect x="230" y="255" width="150" height="175" rx="8" fill="#27272A" stroke="#3F3F46" stroke-width="1"/>
  <rect x="240" y="265" width="130" height="90" rx="6" fill="url(#accentGrad)" opacity="0.8"/>
  <rect x="240" y="365" width="90" height="10" rx="3" fill="#FAFAFA"/>
  <rect x="240" y="385" width="60" height="8" rx="3" fill="#A1A1AA"/>

  <rect x="395" y="255" width="150" height="175" rx="8" fill="#27272A" stroke="#3F3F46" stroke-width="1"/>
  <rect x="405" y="265" width="130" height="90" rx="6" fill="#3B82F6" opacity="0.8"/>
  <rect x="405" y="365" width="90" height="10" rx="3" fill="#FAFAFA"/>
  <rect x="405" y="385" width="60" height="8" rx="3" fill="#A1A1AA"/>

  <rect x="560" y="255" width="150" height="175" rx="8" fill="#27272A" stroke="#3F3F46" stroke-width="1"/>
  <rect x="570" y="265" width="130" height="90" rx="6" fill="#10B981" opacity="0.8"/>
  <rect x="570" y="365" width="90" height="10" rx="3" fill="#FAFAFA"/>
  <rect x="570" y="385" width="60" height="8" rx="3" fill="#A1A1AA"/>
</svg>

